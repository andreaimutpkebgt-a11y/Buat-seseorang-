<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From reaimut For You ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #fce8ed;
      background-image: radial-gradient(#f7cad0 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Container Utama */
    .scene {
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Amplop Surat */
    .envelope {
      width: 180px;
      height: 120px;
      background: #f8ad9d;
      border: 3px solid #f4acb7;
      border-radius: 12px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 15px rgba(244, 172, 183, 0.4);
      margin-bottom: 60px;
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-top: 60px solid #f0718f;
    }

    .envelope-text {
      position: absolute;
      bottom: 12px;
      font-size: 13px;
      font-weight: bold;
      color: #9d0208;
      background: #ffe5ec;
      padding: 3px 8px;
      border-radius: 8px;
    }

    /* Container Simbol Panah */
    .arrow-container {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .arrow-symbol {
      font-size: 50px;
      margin-bottom: 5px;
      display: inline-block;
      transform: rotate(-45deg);
    }

    .arrow-subtext {
      font-size: 11px;
      color: #7209b7;
      font-weight: bold;
      transition: opacity 0.2s;
      margin-top: 10px;
    }

    /* Animasi Gerakan Panah: Kiri -> Kanan -> Melesat ke Surat */
    .arrow-zigzag {
      animation: zigzagShoot 1.4s forwards ease-in-out;
    }

    @keyframes zigzagShoot {
      0% {
        transform: translate(0, 0) rotate(-45deg);
      }
      25% {
        transform: translate(-80px, -20px) rotate(-45deg);
      }
      55% {
        transform: translate(80px, -60px) rotate(-45deg);
      }
      75% {
        transform: translate(0px, -100px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(0px, -200px) scale(0.5) rotate(0deg);
        opacity: 0;
      }
    }

    /* Pop-up Window Pixel Art */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .pixel-box {
      width: 300px;
      background: #fff0f3;
      border: 4px solid #ff758f;
      border-radius: 10px;
      box-shadow: 6px 6px 0px #c9184a;
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    .pixel-header {
      background: #ff758f;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
    }

    .pixel-body {
      padding: 20px 15px;
    }

    .cat-avatar {
      font-size: 60px;
      margin-bottom: 10px;
      display: block;
    }

    .question {
      font-size: 14px;
      color: #590d22;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Tombol */
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 40px;
    }

    .btn {
      padding: 8px 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #590d22;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #590d22;
    }

    .btn-yes {
      background: #ff4d6d;
      color: white;
    }

    .btn-no {
      background: #ffffff;
      color: #333;
      position: absolute;
      right: 40px;
      transition: all 0.15s ease;
    }

    /* Partikel Hati */
    .heart-particle {
      position: fixed;
      color: #ff4d6d;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 2.5s ease-out forwards;
      z-index: 999;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="envelope">
      <div class="envelope-text">💌 From reaimut For You</div>
    </div>

    <div class="arrow-container" id="arrow" onclick="shootArrow()">
      <div class="arrow-symbol">💘</div>
      <div class="arrow-subtext" id="subtext">Klik untuk kirim sinyal persahabatan! ✨</div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="pixel-box">
      <div class="pixel-header">
        <span>BESTIE?</span>
        <span>♥ ♥ ♥</span>
      </div>
      <div class="pixel-body" id="modalBody">
        <span class="cat-avatar">🐱</span>
        <div class="question">Hai! reaimut mau tanya... <br><br>Mau gak jadi sahabat terbaikku? 🥺👉👈</div>
        <div class="btn-group">
          <button class="btn btn-yes" onclick="acceptFriendship()">MAU!</button>
          <button class="btn btn-no" id="btnNo" onmouseover="dodgeNo()" onclick="dodgeNo()" ontouchstart="dodgeNo()">GAK</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isShooting = false;
    // Nomor WhatsApp kamu
    const nomorWA = "6287856912013";

    function shootArrow() {
      if (isShooting) return; 
      isShooting = true;

      const arrow = document.getElementById('arrow');
      const subtext = document.getElementById('subtext');
      
      subtext.style.opacity = '0'; 
      arrow.classList.add('arrow-zigzag');

      setTimeout(() => {
        document.getElementById('modal').style.display = 'flex';
      }, 1300);
    }

    // Tombol GAK menghindar
    function dodgeNo() {
      const btnNo = document.getElementById('btnNo');
      const randomX = (Math.random() - 0.5) * 180;
      const randomY = (Math.random() - 0.5) * 120;
      btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    // Tombol MAU diklik -> Kirim Jawaban ke WA
    function acceptFriendship() {
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <span class="cat-avatar">😻🤝😸</span>
        <div class="question" style="color: #ff4d6d; font-size: 16px;">Yayy! Resmi jadi Bestie! ♡</div>
        <p style="font-size: 12px; color: #555; margin-bottom: 12px;">Menghubungkan ke WhatsApp reaimut...</p>
        <div style="background: #ff4d6d; color: white; padding: 6px; border-radius: 6px; font-weight: bold; font-size: 12px; display: inline-block;">BEST FRIENDS FOREVER</div>
      `;

      // Hujan hati/bintang
      for (let i = 0; i < 35; i++) {
        setTimeout(createFriendshipParticle, i * 80);
      }

      // Pesan otomatis yang akan terkirim ke WhatsApp
      const pesanWA = encodeURIComponent("Hai reaimut! Aku mau kok jadi sahabat terbaik kamu! 🥳💖");

      // Buka WhatsApp setelah 2 detik
      setTimeout(() => {
        window.location.href = `https://wa.me/${nomorWA}?text=${pesanWA}`;
      }, 2000);
    }

    function createFriendshipParticle() {
      const particle = document.createElement('div');
      particle.classList.add('heart-particle');
      particle.innerHTML = Math.random() > 0.5 ? '💖' : '⭐';
      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.top = '100vh';
      document.body.appendChild(particle);

      setTimeout(() => particle.remove(), 2500);
    }
  </script>

</body>
            </html>
